name: xrecorder
description: Android screen recorder and non-destructive media editor.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  characters: ^1.4.1
  go_router: ^18.1.2
  lucide_flutter: 1.66.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/licenses/
    - assets/images/onboarding/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
