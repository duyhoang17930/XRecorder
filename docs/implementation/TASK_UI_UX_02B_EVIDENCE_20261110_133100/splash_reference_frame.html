<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#f6f3f0;width:100%;height:100%;display:grid;place-items:center}canvas{max-width:100vw;max-height:100vh;object-fit:contain}</style></head><body><video id="v" muted playsinline preload="auto" src="file:///D:/FAU_App/XRecorder/docs/implementation/UI/splask.mp4"></video><script>
(async()=>{const v=document.getElementById('v');await new Promise((r,j)=>{if(v.readyState>=1)r();else{v.addEventListener('loadedmetadata',r,{once:true});v.addEventListener('error',()=>j(new Error('video decode failed')),{once:true})}});const d=v.duration;const t=Number(new URLSearchParams(location.search).get('t')||0);await new Promise((r,j)=>{v.addEventListener('seeked',r,{once:true});v.currentTime=Math.min(Math.max(0,t),Math.max(0,d-.02));if(v.seeking===false&&v.readyState>=2)setTimeout(r,250)});const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);document.body.replaceChildren(c);document.title='ready '+d+' '+t;})();
</script></body></html>
